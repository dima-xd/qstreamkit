plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.qprofprobe'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '27.0.11902837'

    defaultConfig {
        applicationId 'com.example.qprofprobe'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
