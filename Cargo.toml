[workspace]
resolver = "2"
members = [
    "crates/qstream-core",
    "crates/qstream-transport",
    "crates/qstream-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["QStreamKit contributors"]
repository = "https://github.com/dima-xd/qstreamkit"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
thiserror = "1"
