name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: qstream
          target: ${{ matrix.target }}
          archive: qstream-${{ github.ref_name }}-${{ matrix.target }}
          checksum: sha256
          include: README.md,LICENSE-MIT,LICENSE-APACHE,NOTICE
          token: ${{ secrets.GITHUB_TOKEN }}
